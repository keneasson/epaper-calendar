# gitleaks configuration for the Calendar monorepo.
# Runs in CI (.github/workflows/secrets-scan.yml) and the local pre-commit hook
# (.githooks/pre-commit). Extends the built-in ruleset and adds a rule that
# catches the failure mode this repo actually had: a WiFi password hardcoded as
# a string literal in firmware source (see issue #3).

title = "Calendar monorepo secret scan"

[extend]
useDefault = true

# A hardcoded credential assigned to a password/psk-like identifier in source,
# e.g.  const char* HOME_PASSWORD = "hunter2";
# Catches C/C++ assignment and JS/TS object styles; #define-style config lives
# only in gitignored config.h, guarded by .gitignore rather than this rule.
[[rules]]
id = "hardcoded-credential-assignment"
description = "Hardcoded password/PSK string literal in source"
regex = '''(?i)(password|passwd|pwd|psk|pre[-_]?shared[-_]?key)\s*[:=]\s*"[^"]{6,63}"'''
keywords = ["password", "passwd", "psk"]

[rules.allowlist]
# This heuristic is for SHIPPED SOURCE. Docs and templates must show example
# credentials to be useful, so scope the rule away from them - real keys/tokens
# in those files are still caught by gitleaks' built-in rules.
paths = [
  '''.*\.md$''',                 # documentation (shows WIFI_PASSWORD = "..." examples)
  '''.*config_template\.h$''',   # placeholder-only templates
  '''.*/simulation/.*''',        # native-sim mock data and stubs
]
regexTarget = "match"
regexes = [
  '''process\.env''',  # reading from env, not a literal
  '''getenv''',
  '''(?i)your[\s_\-]*(wifi[\s_\-]*)?(password|passwd|pwd|ssid|key|secret|token)''',
  '''(?i)(changeme|change[\s_\-]?me|placeholder|example|dummy|sample)''',
]

[allowlist]
description = "Repo-wide allowlist: templates, docs, and tracked test fixtures"
paths = [
  '''.*config_template\.h$''',   # placeholder-only templates
  '''.*\.gitleaks\.toml$''',     # this file (contains the patterns themselves)
  '''.*/simulation/api_response\.json$''',  # mock calendar data, no secrets
]
# Documentation/template placeholder values that are not real secrets. Matched
# against the captured secret, case-insensitively, allowing the common styles:
# YOUR_WIFI_PASSWORD, YourWiFiPassword, your-password, <your password>, etc.
regexes = [
  '''(?i)your[\s_\-]*(wifi[\s_\-]*)?(password|passwd|pwd|ssid|key|secret|token)''',
  '''(?i)(example|changeme|change[\s_\-]?me|placeholder|redacted|dummy|sample)''',
  '''(?i)^x{3,}$''',
  '''(?i)<[^>]*(password|secret|key|token|ssid)[^>]*>''',
]
