; PlatformIO Configuration for Home Calendar E-Ink Display
; ESP32-C6 + GooDisplay GDEY075Z08 (3-color, portrait mode)

[platformio]
default_envs = firebeetle_c6

; =============================================================================
; ESP32-C6 with GooDisplay GDEY075Z08 (3-color) - Portrait Mode (480x800)
; =============================================================================

[env:firebeetle_c6]
; pioarduino 55.03.39 = arduino-esp32 3.3.9 + ESP-IDF 5.5.4. Newer IDF matters
; on the C6: the WiFi PHY calibration blobs ship inside the IDF release, and
; 2025+ boards carry newer silicon revisions that misbehave on older blobs
; (plus several WiFi6/WPA3 interop fixes landed in IDF 5.5.x).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Pin to the C6's native USB-Serial/JTAG (macOS). Without this, PlatformIO's
; auto-detect can pick an unrelated serial device (e.g. Bluetooth audio).
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*
board_build.partitions = partitions_c6.csv
lib_extra_dirs = ../../libs

lib_deps =
    zinggjm/GxEPD2@^1.5.8
    adafruit/Adafruit GFX Library@^1.11.9
    bblanchon/ArduinoJson@^6.21.5

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DESP32_C6_BUILD=1
    -DDEBUG_MODE=1
    -DCORE_DEBUG_LEVEL=4
    -Wall

; Diagnostic build for ESP32-C6.
; Routes Serial to the native USB-Serial/JTAG (CDC) so logs are visible over the
; USB port (needs ARDUINO_USB_MODE=1 on the C6), and enables WIFI_DIAG to scan
; and log all visible networks (RSSI/security) before connecting. Pair with
; tools/diagnostics/serial_capture.py. Not for production (USB CDC costs power).
[env:firebeetle_c6_diag]
extends = env:firebeetle_c6
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DESP32_C6_BUILD=1
    -DDEBUG_MODE=1
    -DCORE_DEBUG_LEVEL=4
    -DWIFI_DIAG=1
    -Wall

; Debug build for ESP32-C6
[env:firebeetle_c6_debug]
extends = env:firebeetle_c6
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DESP32_C6_BUILD=1
    -DDEBUG_MODE=1
    -DCORE_DEBUG_LEVEL=4
    -Wall

; Production build (minimal logging)
[env:firebeetle_c6_prod]
extends = env:firebeetle_c6
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DESP32_C6_BUILD=1
    -DDEBUG_MODE=0
    -DCORE_DEBUG_LEVEL=0
    -DPRODUCTION=1
    -Wall
