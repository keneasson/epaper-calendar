; PlatformIO Configuration for Church Schedule E-Ink Display
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = firebeetle

; Common settings for ESP32 environments only
[esp32_base]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    zinggjm/GxEPD2@^1.5.8
    adafruit/Adafruit GFX Library@^1.11.9
    bblanchon/ArduinoJson@^6.21.5
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wall

; Production build for FireBeetle 2 ESP32-E
[env:firebeetle]
extends = esp32_base
board = dfrobot_firebeetle2_esp32e
build_flags =
    ${esp32_base.build_flags}
    -DPRODUCTION=1

; Debug build with extra logging
[env:firebeetle_debug]
extends = esp32_base
board = dfrobot_firebeetle2_esp32e
build_type = debug
build_flags =
    ${esp32_base.build_flags}
    -DDEBUG_MODE=1
    -DCORE_DEBUG_LEVEL=4

; Wokwi simulation environment
[env:wokwi]
extends = esp32_base
board = dfrobot_firebeetle2_esp32e
build_flags =
    ${esp32_base.build_flags}
    -DWOKWI_SIMULATION=1

; Native environment for desktop simulation/testing
; Does NOT extend esp32_base - uses native platform without framework
[env:native]
platform = native
build_flags =
    -DNATIVE_BUILD=1
    -DSIMULATION=1
    -DDEBUG_MODE=1
    -std=c++17
    -Wall
    -I simulation
    -I simulation/Fonts
build_src_filter =
    +<*>
    +<../simulation/*.cpp>
lib_deps =
    bblanchon/ArduinoJson@^6.21.5
test_framework = unity
