; BLE Test App for ESP32-C6
; WiFi provisioning via BLE

[env:firebeetle_c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
board = dfrobot_firebeetle2_esp32c6
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Use huge_app partition to fit BLE + WiFi
board_build.partitions = huge_app.csv

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -Wall
