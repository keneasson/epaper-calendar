; PlatformIO Configuration for Church Schedule E-Ink Display
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = firebeetle

; Common settings for ESP32 environments only
[esp32_base]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../../libs
lib_deps =
    zinggjm/GxEPD2@^1.5.8
    adafruit/Adafruit GFX Library@^1.11.9
    bblanchon/ArduinoJson@^6.21.5
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wall

; Production build for FireBeetle 2 ESP32-E
[env:firebeetle]
extends = esp32_base
board = dfrobot_firebeetle2_esp32e
build_flags =
    ${esp32_base.build_flags}
    -DPRODUCTION=1

; Debug build with extra logging
[env:firebeetle_debug]
extends = esp32_base
board = dfrobot_firebeetle2_esp32e
build_type = debug
build_flags =
    ${esp32_base.build_flags}
    -DDEBUG_MODE=1
    -DCORE_DEBUG_LEVEL=4

; Wokwi simulation environment
[env:wokwi]
extends = esp32_base
board = dfrobot_firebeetle2_esp32e
build_flags =
    ${esp32_base.build_flags}
    -DWOKWI_SIMULATION=1

; Native environment for desktop simulation/testing
; Does NOT extend esp32_base - uses native platform without framework
[env:native]
platform = native
build_flags =
    -DNATIVE_BUILD=1
    -DSIMULATION=1
    -DDEBUG_MODE=1
    -std=c++17
    -Wall
    -I simulation
    -I simulation/Fonts
build_src_filter =
    +<*>
    +<../simulation/*.cpp>
lib_deps =
    bblanchon/ArduinoJson@^6.21.5
test_framework = unity

; =============================================================================
; ESP32-C6 with GooDisplay GDEY075Z08 (3-color)
; =============================================================================

[env:firebeetle_c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions_c6.csv
lib_extra_dirs = ../../libs

lib_deps =
    zinggjm/GxEPD2@^1.5.8
    adafruit/Adafruit GFX Library@^1.11.9
    bblanchon/ArduinoJson@^6.21.5

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DESP32_C6_BUILD=1
    -DDEBUG_MODE=1
    -DTEST_MODE=1
    -DCORE_DEBUG_LEVEL=4
    -Wall

; Debug build for ESP32-C6
[env:firebeetle_c6_debug]
extends = env:firebeetle_c6
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DESP32_C6_BUILD=1
    -DDEBUG_MODE=1
    -DTEST_MODE=1
    -DCORE_DEBUG_LEVEL=4
    -DDISABLE_BLE_PROVISIONING=1
    -Wall

; Accelerated test mode for ESP32-C6
; Uses mock data and 20-minute cycle (15 min Next Week, 5 min Current Week)
[env:firebeetle_c6_accel_test]
extends = env:firebeetle_c6
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DESP32_C6_BUILD=1
    -DDEBUG_MODE=1
    -DACCELERATED_TEST_MODE=1
    -DCORE_DEBUG_LEVEL=4
    -Wall

; =============================================================================
; ESP32-C6 with ESP-IDF (native, no Arduino) - Full HTTPS support
; =============================================================================

[env:firebeetle_c6_idf]
platform = espressif32
board = esp32-c6-devkitc-1
framework = espidf
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DESP32_C6_BUILD=1
    -DDEBUG_MODE=1

; ESP-IDF specific settings
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS=sdkconfig.defaults
